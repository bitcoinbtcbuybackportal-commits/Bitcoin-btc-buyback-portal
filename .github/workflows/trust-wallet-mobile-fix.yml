name: Repair Trust Wallet mobile connection

on:
  push:
    branches: [main]
    paths-ignore:
      - "app.js"
      - "README-trust-fix.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch app.js
        shell: bash
        run: |
          set -e
          git checkout d057231959816486aca102c18cf923cd6b8e26b8 -- app.js
          python3 -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(encoding="utf-8"); marker="let trustWalletUserInitiated = false;"; helper="\n\n/* TRUST WALLET PENDING STATE HELPERS */\nfunction setTrustWalletPending() {\n  const button = document.getElementById("connectWallet");\n  if (!button) return;\n  button.dataset.previousText = button.textContent || "Connect Wallet";\n  button.setAttribute("aria-busy", "true");\n  button.textContent = "Opening Trust Wallet...";\n}\n\nfunction clearTrustWalletPending() {\n  const button = document.getElementById("connectWallet");\n  if (!button) return;\n  button.removeAttribute("aria-busy");\n  if (!connectedAddress) button.textContent = button.dataset.previousText || "Connect Wallet";\n  delete button.dataset.previousText;\n}\n"; assert marker in s; assert "function setTrustWalletPending()" not in s; p.write_text(s.replace(marker, marker+helper, 1), encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Trust Wallet mobile connection" || exit 0
          git push origin HEAD:main
