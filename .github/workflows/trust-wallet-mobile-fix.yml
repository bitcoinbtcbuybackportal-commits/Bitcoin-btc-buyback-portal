name: Repair Trust Wallet mobile connection

on:
  push:
    branches: [main]
    paths-ignore:
      - "app.js"
      - "README-trust-fix.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch app.js
        shell: bash
        run: |
          set -e
          git checkout d057231959816486aca102c18cf923cd6b8e26b8 -- app.js
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")
          marker = "let trustWalletUserInitiated = false;"
          helper = '''

/* ==========================================================
   TRUST WALLET PENDING STATE HELPERS
   ========================================================== */
function setTrustWalletPending() {
  const button = document.getElementById("connectWallet");
  if (!button) return;
  button.dataset.previousText = button.textContent || "Connect Wallet";
  button.setAttribute("aria-busy", "true");
  button.textContent = "Opening Trust Wallet...";
}

function clearTrustWalletPending() {
  const button = document.getElementById("connectWallet");
  if (!button) return;
  button.removeAttribute("aria-busy");
  if (!connectedAddress) {
    button.textContent = button.dataset.previousText || "Connect Wallet";
  }
  delete button.dataset.previousText;
}
'''

          if "function setTrustWalletPending()" not in text:
              if marker not in text:
                  raise SystemExit("Trust Wallet state marker not found")
              text = text.replace(marker, marker + helper, 1)
              path.write_text(text, encoding="utf-8")

          print("Trust Wallet helper added successfully")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Trust Wallet mobile connection"
          git push origin HEAD:main
