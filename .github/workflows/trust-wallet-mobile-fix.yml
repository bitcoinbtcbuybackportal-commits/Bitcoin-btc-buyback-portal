name: Fix Trust Wallet mobile connection

on:
  push:
    branches: [main]
    paths-ignore:
      - "app.js"
      - "trust-wallet-fix.js"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.js with missing Trust Wallet helpers
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text(encoding="utf-8")

          if "function setTrustWalletPending()" not in s:
              helper = r'''\n\n/* ==========================================================\n   TRUST WALLET MOBILE PENDING STATE\n   ========================================================== */\nfunction setTrustWalletPending() {\n  const button = document.getElementById("connectWallet");\n  if (!button) return;\n  button.dataset.previousText = button.textContent || "Connect Wallet";\n  button.setAttribute("aria-busy", "true");\n  button.textContent = "Opening Trust Wallet...";\n}\n\nfunction clearTrustWalletPending() {\n  const button = document.getElementById("connectWallet");\n  if (!button) return;\n  button.removeAttribute("aria-busy");\n  if (!window.__trustWalletConnected) {\n    button.textContent = button.dataset.previousText || "Connect Wallet";\n  }\n  delete button.dataset.previousText;\n}\n'''
              p.write_text(s + helper, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "Fix Trust Wallet mobile connection state"
          git push origin HEAD:main
