name: Repair Trust Wallet mobile connection

on:
  push:
    branches: [main]
    paths-ignore:
      - "app.js"
      - "repair-trigger.txt"
      - "repair-trigger2.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and patch app.js
        shell: bash
        run: |
          set -e
          git show d057231959816486aca102c18cf923cd6b8e26b8:app.js > app.js
          python3 -c 'import base64; from pathlib import Path; p=Path("app.js"); s=p.read_text(encoding="utf-8"); marker="let trustWalletUserInitiated = false;"; helper=base64.b64decode("").decode(); assert marker in s; assert "function setTrustWalletPending()" not in s; p.write_text(s.replace(marker,marker+helper,1),encoding="utf-8")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix Trust Wallet mobile connection" || exit 0
          git push origin HEAD:main
