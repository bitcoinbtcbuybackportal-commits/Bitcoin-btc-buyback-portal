name: Repair Trust Wallet now

on:
  push:
    branches:
      - main
    paths-ignore:
      - app.js
      - repair-trigger.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore good app.js and patch missing helper
        run: |
          set -e
          git show d057231959816486aca102c18cf923cd6b8e26b8:app.js > app.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.js")
          s = p.read_text(encoding="utf-8")
          marker = "let trustWalletUserInitiated = false;"
          helper = '''

/* TRUST WALLET PENDING STATE HELPERS */
function setTrustWalletPending() {
  const button = document.getElementById("connectWallet");
  if (!button) return;
  button.dataset.previousText = button.textContent || "Connect Wallet";
  button.setAttribute("aria-busy", "true");
  button.textContent = "Opening Trust Wallet...";
}

function clearTrustWalletPending() {
  const button = document.getElementById("connectWallet");
  if (!button) return;
  button.removeAttribute("aria-busy");
  if (!connectedAddress) {
    button.textContent = button.dataset.previousText || "Connect Wallet";
  }
  delete button.dataset.previousText;
}
'''
          if "function setTrustWalletPending()" not in s:
              if marker not in s:
                  raise SystemExit("marker not found")
              s = s.replace(marker, marker + helper, 1)
              p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Repair Trust Wallet mobile connection"
          git push origin HEAD:main
