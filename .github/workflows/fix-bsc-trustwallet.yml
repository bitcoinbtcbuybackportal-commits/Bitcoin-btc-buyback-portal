name: Fix Trust Wallet BSC deep link

on:
  push:
    branches: [main]
    paths-ignore:
      - "app-base.js"
      - ".github/workflows/fix-bsc-trustwallet.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Trust Wallet network
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app-base.js")
          s = p.read_text(encoding="utf-8")
          old = '"?coin_id=60"'
          new = '"?coin_id=20000714"'
          if old not in s:
              raise SystemExit("Expected Trust Wallet Ethereum deep-link was not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Trust Wallet deep link changed from Ethereum to BNB Smart Chain")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-base.js
          git commit -m "Fix Trust Wallet BSC mobile deep link"
          git push origin HEAD:main
